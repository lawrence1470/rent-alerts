name: Check Alerts Cron Job

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  check-alerts-production:
    name: Check Alerts (Production Only)
    runs-on: ubuntu-latest
    steps:
      - name: Call production cron endpoint
        run: |
          curl -X GET "https://rentnotify.com/api/cron/check-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -f -v

# NOTE: Preview/localhost alerts are DISABLED by default
# The API endpoint blocks automatic triggers on non-production environments
# To manually test alerts on preview/localhost, use:
#   curl -X GET "https://<preview-url>/api/cron/check-alerts?manual=true" \
#     -H "Authorization: Bearer <CRON_SECRET>"
